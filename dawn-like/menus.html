<!doctype html>
<html lang="en-GB">
<head><meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Menus and disclosures</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  header { display: flex; gap: 30px; padding: 16px; border-bottom: 1px solid #ccc; }
  header details, .facets details, .dropdown { position: relative; }
  .panel { position: absolute; top: 100%; left: 0; background: #fff; border: 1px solid #333; padding: 10px; z-index: 5; width: 200px; }
  .hidden { display: none; }
  .facets { display: flex; gap: 40px; padding: 20px; }
  summary { cursor: pointer; }
  main { padding: 20px; }
</style></head>
<body><p style="margin:0;padding:8px 16px;background:#fff8c5;color:#1f1f1f;border-bottom:1px solid #8a6d00;font:16px/1.4 Arial,sans-serif">Fictional test shop for accessibility testing. Nothing here is real and nothing can be bought.</p>
<header>
  <a href="#home">Home</a>
  <!-- Shopify Dawn search: a native <summary> with role="button" (the browser still reports collapsed/expanded
       itself), no aria-expanded -->
  <details id="search-modal">
    <summary aria-haspopup="dialog" role="button" aria-label="Search">Search</summary>
    <div class="panel" role="dialog" aria-modal="true" aria-label="Search"><input id="search-input" type="search" aria-label="Search"><a href="#search-all">Search all</a></div>
  </details>
  <!-- the real fault: a button that opens a drop-down menu, with no aria-expanded and no Escape -->
  <div class="dropdown">
    <button id="account-btn" type="button">Account</button>
    <div id="account-menu" class="panel hidden"><a href="#orders">Orders</a><a href="#addresses">Addresses</a></div>
  </div>
</header>
<main>
  <h1>Bags</h1>
  <!-- Shopify Dawn collection filters: drop-downs that close on Escape while focus is inside them
       (keyup on the details: event.target.closest('details[open]')), not from the next control -->
  <div class="facets">
    <details id="Details-availability" class="facet"><summary aria-expanded="false">Availability</summary>
      <div class="panel"><a href="#reset-availability">Reset</a><label><input type="checkbox" name="stock"> In stock</label></div></details>
    <details id="Details-price" class="facet"><summary aria-expanded="false">Price</summary>
      <div class="panel"><a href="#reset-price">Reset</a><label>From <input type="number" name="from"></label></div></details>
    <a href="#all">View all</a>
  </div>
  <p>Our range of bags.</p>
  <div style="height: 1400px"></div>
  <!-- Shopify Dawn's "You may also like": products fetched when the section is scrolled to, not caused by
       any control near it -->
  <section id="recommendations" aria-label="You may also like"><h2>You may also like</h2></section>
</main>
<footer style="padding: 20px; display: flex; gap: 40px">
  <!-- Shopify Dawn country selector: a button with aria-controls; Escape from inside closes it -->
  <div class="disclosure" id="FooterCountry">
    <button id="country-btn" type="button" aria-expanded="false" aria-controls="country-list">Canada | CAD $</button>
    <ul id="country-list" hidden><li><a href="#ca">Canada</a></li><li><a href="#gb">United Kingdom</a></li><li><a href="#us">United States</a></li></ul>
  </div>
  <!-- the real fault: a menu built by script next to its button when opened (no aria-controls), ignoring Escape -->
  <div class="dropdown" id="help">
    <button id="help-btn" type="button" aria-haspopup="true">Help</button>
  </div>
</footer>
<script>
  // Dawn's global.js
  function onKeyUpEscape(event) {
    if (event.code.toUpperCase() !== 'ESCAPE') return;
    const open = event.target.closest('details[open]');
    if (!open) return;
    const summary = open.querySelector('summary');
    open.removeAttribute('open');
    summary.setAttribute('aria-expanded', false);
    summary.focus();
  }
  document.querySelectorAll('[id^="Details-"] summary').forEach((summary) => {
    summary.parentNode.addEventListener('keyup', onKeyUpEscape);
    summary.addEventListener('click', (e) => { e.currentTarget.setAttribute('aria-expanded', !e.currentTarget.closest('details').hasAttribute('open')); });
  });
  // Dawn's details-modal: Escape closes and returns focus to the summary
  const sm = document.getElementById('search-modal');
  sm.addEventListener('toggle', () => { if (sm.open) document.getElementById('search-input').focus(); });
  sm.addEventListener('keyup', (e) => { if (e.code.toUpperCase() === 'ESCAPE' && sm.open) { sm.open = false; sm.querySelector('summary').focus(); } });
  // the faulty drop-down: toggles on click, ignores Escape, never says whether it is open
  const ab = document.getElementById('account-btn'), am = document.getElementById('account-menu');
  ab.addEventListener('click', () => am.classList.toggle('hidden'));
  // "You may also like": loaded a moment after the section comes into view
  new IntersectionObserver((entries, obs) => {
    if (!entries.some((e) => e.isIntersecting)) return;
    obs.disconnect();
    setTimeout(() => {
      const sec = document.getElementById('recommendations');
      for (const n of ['Mini Eddy', 'Studio Bag', 'Helix']) { const a = document.createElement('a'); a.href = '#' + n.toLowerCase().replace(/ /g, '-'); a.textContent = n; a.style.display = 'block'; sec.appendChild(a); }
    }, 250);
  }).observe(document.getElementById('recommendations'));
  // Dawn's localization form
  const cb = document.getElementById('country-btn'), cl = document.getElementById('country-list');
  cb.addEventListener('click', () => { const open = cb.getAttribute('aria-expanded') === 'true'; cb.setAttribute('aria-expanded', String(!open)); cl.hidden = open; });
  document.getElementById('FooterCountry').addEventListener('keyup', (e) => { if (e.code.toUpperCase() === 'ESCAPE' && !cl.hidden) { cl.hidden = true; cb.setAttribute('aria-expanded', 'false'); cb.focus(); } });
  // the faulty Help menu: created on the first click, toggled after that, never closed by Escape
  const hb = document.getElementById('help-btn');
  hb.addEventListener('click', () => {
    let m = document.getElementById('help-menu');
    if (!m) { m = document.createElement('div'); m.id = 'help-menu'; m.className = 'panel'; m.innerHTML = '<a href="#faq">FAQ</a> <a href="#returns">Returns</a>'; hb.parentNode.appendChild(m); }
    else m.classList.toggle('hidden');
  });
</script>
</body>
</html>
