name: TalkBack keys diagnostic
# Diagnostic only, on its own branch (deleted afterwards): where TalkBack's keys stop on the emulator
on:
  push:
    branches: [tb-diag]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: claude/new-session-d0l0jo
          repository: Jasong-ithub/accessibility-full-tool
          token: ${{ secrets.TOOL_READ_TOKEN }}
          persist-credentials: false
          path: tool
          sparse-checkout: addons/screenreader/lib
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build TalkBack with key logging (diagnostic build)
        run: |
          sed -i 's|^gradle --no-daemon -q assemblePhoneDebug|python3 "$PATCH" . \&\& gradle --no-daemon -q assemblePhoneDebug|' tool/addons/screenreader/lib/talkback-build.sh
          grep -n "assemblePhoneDebug" tool/addons/screenreader/lib/talkback-build.sh
          PATCH=$PWD/.github/tb-diag/patch.py bash tool/addons/screenreader/lib/talkback-build.sh talkback.apk
      - name: Let the Android emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Diagnose
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          pre-emulator-launch-script: echo "hw.keyboard=yes" >> ~/.android/avd/test.avd/config.ini
          script: bash .github/tb-diag/diag.sh
