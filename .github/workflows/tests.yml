# PUBLIC TEST SITES COPY of the tool's test suite (owner decisions D349, D350). Made by
# tools/make-testshop-site.mjs from the tool's own .github/workflows/tests.yml: do not edit it here. Each job checks
# out the tool's PRIVATE repository at run time with a read-only key kept as the secret TOOL_READ_TOKEN, so the tool's
# code is never published, and the minutes are free (a public repository). Only our own code and our own made-up
# test sites are used here: client pages and free audits never come here (they stay on the private repository).
# Runs the project's tests on GitHub.
#   OWNER DECISION D315 (1 November 2026): a push runs only the two quick jobs (conflicts and docs); every other job
#   runs on a pull request or by hand (Actions tab, "Run workflow"), and a newer push cancels an older run (its weekly
#   run moved to the public copy, D350).
#   Run the full set by hand before merging finished work: in the public test sites repository, where it is free (D350).
#   Since 9 November 2026 the public copy runs every job after every push to this branch (D358): an hourly check there
#   runs them for the newest commit not yet tested, and weekly whatever changed (free minutes; make-testshop-site.mjs).
#   The jobs: two checks and every test file except test/run-tests.js (which the full job runs), side by side so none
#   waits on another:
#     listed     every test file in the project is run by this workflow, once (tools/check-tests-listed.mjs), and
#                the code rules for the round 1 safety findings (tools/check-safety.mjs), with S17's behaviour test
#                of every runner that loads a live page (test/live-guard-tests.js), about 14 minutes
#     conflicts  no tracked file holds a leftover merge conflict marker
#     docs       the documents check (tools/check-docs.mjs): no replaced wording or prices, no em dashes, no missing
#                paths, no options the code does not accept, no future-dated build records, and the rules tying the
#                documents to the code (round 1 documents review, 28 October 2026), with its own tests, and the
#                comparison evidence check (test/compare-tests.js, D225)
#     quick      the fast checks (lead emails, agencies, standards and law wording, prices, legal details, opt-outs,
#                languages, the Getting started pack, the hand-over, the Dawn checks, tool parity, AAA and law beyond
#                WCAG, email views, the remote screen reader route, monitoring bills and statements, the fix recipes
#                for the interaction gaps, the quality gate and its send paths, the WebAIM email), about 15 minutes
#     benchmark  the benchmark shop and its answer key (D241, D242), about 20 to 25 minutes
#     benchmarktools  here by hand only (the public copy also on each scheduled run that tests a commit: each new
#                commit, and weekly, D358): the converters and coverage analysis of the benchmark tool runs (D334 to
#                D340), under a minute
#     monitor    monitoring and the add-ons that map and walk a site (designs, cross-page, process, sign-in,
#                re-audit, documents), about 30 minutes
#     addons     every other add-on's own tests, and the demo fixes, about 35 minutes
#     gaps       the gap tests of the content, interaction, keyboard and timing add-ons (28 October 2026)
#     fixes      the fix engine, with route 2, apply, the add-on fixes and the fixes by rule, about 35 minutes
#     prelive    the before-live page check, about 15 to 22 minutes
#     everypage  the full audit on every page, the free audit in two stages, the D296 free audit, the tool comparison's fixes (G1 to G4,
#                F1 to F4), the council page fixes and the consent dialog fixes, in Chromium and Firefox, about 30 minutes
#     overlayonoff  the overlay on/off test with our fixes as the third column (D246, D247) and each widget profile
#                tested like a person (D427), about 15 minutes
#     signedin   signed-in mode, with a full audit behind a sign-in in three browsers, about 45 minutes
#   On a pull request and on demand: also the full test set (npm test), in its own job beside them (the public copy
#   also runs it on each scheduled run there that tests a commit: each new commit, and weekly, D358).
# Every test file in the project (any *-tests.js in a test folder) must be run here exactly once: the listed job fails
# otherwise. Add a new one as a "run: node <file>" step in the job that suits it (or, when another test file already
# runs it, as a "# run by <parent>: <file>" line, as in the fixes job).
# Times are those recorded by the agents' reports (27 and 28 October 2026) on a busy 4-core machine (load 17 to 40),
# and time limits are about twice those. Test websites are local fixtures; nothing here contacts a real site, and no
# secrets are used (with no Anthropic key, the AI add-ons use their stubs).
name: Tests

on:
  # every hour: every job, only when the tool's branch has a commit not tested here yet (so after every push, D358);
  # weekly (Sunday 02:17 UTC) and by hand: every job, always; free here
  schedule:
    - cron: '41 * * * *'
    - cron: '17 2 * * 0'
  workflow_dispatch:

# Here a run waits for one still going (never cancels it), and by-hand, hourly and weekly runs queue apart; the tool's
# private copy cancels on a newer push (D315)
concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}-${{ github.event.schedule }}
  cancel-in-progress: false

# Every process of every job is a test run (src/util/test-isolation.js; round 2 of the AI route review, finding 2): it
# never reaches the real AI records or a real claude command, even in a child of a test file that loads nothing from
# src. tools/check-tests-listed.mjs fails if this is taken away.
env:
  A11Y_UNDER_TEST: '1'

jobs:
  # after every push to the tool's branch (D358): every job runs only for a commit not tested here yet
  changed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    outputs:
      run: ${{ steps.mark.outputs.cache-hit != 'true' || steps.tip.outputs.always == 'true' }}
      sha: ${{ steps.tip.outputs.sha }}
    steps:
      - id: tip
        env:
          TOKEN: ${{ secrets.TOOL_READ_TOKEN }}
          REF: ${{ vars.TOOL_REF || 'claude/new-session-d0l0jo' }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          sha=$(git ls-remote "https://x-access-token:${TOKEN}@github.com/Jasong-ithub/accessibility-full-tool" "refs/heads/${REF}" | cut -f1)
          if [ -z "$sha" ]; then echo "::error::the tool's branch $REF could not be read (is the secret TOOL_READ_TOKEN set and in date?)"; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != schedule ] || [ "$CRON" = '17 2 * * 0' ]; then echo "always=true" >> "$GITHUB_OUTPUT"; fi
          echo "The tool's branch $REF is at $sha ($EVENT)"
      - id: mark
        uses: actions/cache/restore@v4
        with:
          path: .tested
          key: tested-${{ steps.tip.outputs.sha }}
          lookup-only: true
      # keeps the schedule on: GitHub switches off a public repository's schedules after 60 days with no activity
      - name: keep the schedule switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/tests.yml/enable" || echo "::warning::The schedule could not be kept switched on (gh api .../enable failed): GitHub stops it after 60 days with no activity here"

  # the workflows here must be the ones tools/make-testshop-site.mjs makes from the tested commit: otherwise a job or
  # test file added to the tool since the copy was last made would not run here; the commit is then not marked tested,
  # so every hourly run is red until the copy is made again
  copy:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: this repository's workflows
        uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          TOKEN: ${{ secrets.TOOL_READ_TOKEN }}
          SHA: ${{ needs.changed.outputs.sha }}
        run: |
          git init -q tool
          git -C tool fetch -q --depth 1 "https://x-access-token:${TOKEN}@github.com/Jasong-ithub/accessibility-full-tool" "$SHA"
          git -C tool checkout -q FETCH_HEAD
          node tool/tools/make-testshop-site.mjs --workflows-match site

  listed:
    needs: changed
    # not on a push: the full set runs on a pull request, by hand, or in the public copy after each push (D315, D358)
    if: needs.changed.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name != 'push')
    runs-on: ubuntu-24.04
    # S17's behaviour test runs every live runner on stand-in pages, the full audit in three browsers and every add-on
    # included: about 14 minutes (40 on a busy machine)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Jasong-ithub/accessibility-full-tool
          ref: ${{ needs.changed.outputs.sha }}
          token: ${{ secrets.TOOL_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # needs no packages: Node's own modules and git only
      - run: node tools/check-tests-listed.mjs
      # S17's behaviour test needs the packages, Chromium, Firefox and WebKit (the full audit's three browsers)
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # the pinned font set (src/util/fonts.js): text the same size on every machine that runs the browsers
      - run: node tools/font-set.mjs --install
      # the code rules for the round 1 safety findings S1 to S15 (docs/review/round1-safety-fixes.txt), and S17 for
      # the overlay settings request, by its words and by behaviour (round 4 candidate-list review, finding 1)
      - run: node tools/check-safety.mjs
      # run by tools/check-safety.mjs: test/live-guard-tests.js

  conflicts:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Jasong-ithub/accessibility-full-tool
          ref: ${{ needs.changed.outputs.sha }}
          token: ${{ secrets.TOOL_READ_TOKEN }}
          persist-credentials: false
      # a line that is only a conflict marker (<<<<<<<, |||||||, ======= or >>>>>>>) in any tracked file
      - run: |
          if git grep -nE '^(<<<<<<<|\|\|\|\|\|\|\||>>>>>>>)( |$)|^=======$'; then
            echo "Leftover merge conflict markers above: finish the merge in those files."
            exit 1
          fi
          echo "No conflict markers in tracked files."

  docs:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # the whole history: the date check reads git blame, and the tests run the check on the documents as they
      # were before the round 1 fixes (commit dfb2a26) to prove each kind of problem is still caught
      - uses: actions/checkout@v4
        with:
          repository: Jasong-ithub/accessibility-full-tool
          ref: ${{ needs.changed.outputs.sha }}
          token: ${{ secrets.TOOL_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the checks need no packages: Node's own modules, git and bash only
      - run: node tools/check-docs.mjs
      # the candidate lists for the owner's one-click approval (round 1 review of the candidate lists)
      - run: node tools/check-candidates.mjs
      - run: node test/check-docs-tests.js
      # the coordination log's times against their commits (git blame: needs this job's whole history)
      - run: node test/coordination-log-tests.js
      # the check that every test file is run, on altered copies of this workflow (the media test's ffmpeg, 9 November 2026)
      - run: node test/check-tests-listed-tests.js
      # the tests below load the tool's own modules (the Upwork test reaches src/report/register.js, which needs exceljs)
      - run: npm ci
      # the Upwork proposal draft and the skill (Upwork proposal review, round 1): approved lines word for word, real
      # character counts, WCAG 2.2 AA, the call to action, banned phrases in the notes too; the old draft from git fails
      - run: node test/upwork-template-tests.js
      # the comparison evidence (D225): the summary's numbers worked out again from the archived raw files
      - run: node test/compare-tests.js
      - run: node test/testshop-site-tests.js
      # our own audit on the benchmark shop (D351): the converter, the missed-faults classifier and the ratchet, and
      # the committed docs/benchmark/ours/ files checked so a fault our audit found before can never be lost
      - run: node test/benchmark-ours-tests.js
      # every unmatched finding of our audit grouped and judged, never sampled (D428): each in exactly one group
      - run: node test/benchmark-unmatched-tests.js
      # the catalogue of ways to fail WCAG 2.2 A and AA (D373, D377): fails on a wrong or out-of-date catalogue (it runs
      # tools/catalogue/check.mjs, which reports its gaps without failing; the weekly job also checks it against w3.org)
      - run: node test/catalogue-tests.js
      # the fix-learning loop (D419): kinds a to e, task briefs, the fix ratchet, and the committed record of the first overlay site made again
      - run: node test/fixes-misses-tests.js
      # real-site learning into the catalogue (D420): matched ways and candidate new ways, the committed record made again
      - run: node test/catalogue-realsite-tests.js

  quick:
    needs: changed
    # not on a push: the full set runs on a pull request, by hand, or in the public copy after each push (D315, D358)
    if: needs.changed.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name != 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Jasong-ithub/accessibility-full-tool
          ref: ${{ needs.changed.outputs.sha }}
          token: ${{ secrets.TOOL_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # the pinned font set (src/util/fonts.js): text the same size on every machine that runs the browsers
      - run: node tools/font-set.mjs --install
      # the quality gate reads the text of PDFs (pdftotext)
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # the opt-out tests also check the Python agency finder
      - run: pip install requests beautifulsoup4 openpyxl
      - run: node test/lead-email-tests.js
      - run: node test/governors-tests.js
      - run: node test/lead-compare-tests.js
      - run: node test/gias-download-tests.js
      - run: node test/lead-robots-tests.js
      # the overlay coverage tables, report, stop rule and searcher (D372), on stand-in runs, search and scans; it starts
      # Chromium, so it runs here, where the browser is installed (it failed in the docs job, 9 November 2026)
      - run: node test/overlay-coverage-tests.js
      - run: node test/preflight-tests.js
      - run: node test/agency-tests.js
      - run: node test/standard-law-tests.js
      # the translated client documents: catalogues complete, English unchanged, A4, the "not checked" hold
      - run: node test/i18n-tests.js
      - run: node test/legal-details-tests.js
      - run: node test/pricing-tests.js
      # the round 1 review fixes: report wording, prices, VAT, Upwork pricing, the law (no browser)
      - run: node test/report-fixes-tests.js
      # the client's own list against our audit (D211, D212)
      - run: node test/client-list-tests.js
      # every sample's figures worked out again from pricing.js; every sample page fits its sheet (pdftotext)
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: node test/sample-figures-tests.js
      - run: node test/suppression-tests.js
      # the public sector lead list: office mailboxes and the contact route, data/leads/ only, lawBasis (D379), the
      # downloader, builder and statement reader with every live-site safeguard (independent review, 9 Nov 2026)
      - run: node test/public-sector-tests.js
      - run: node test/published-compare-tests.js
      # the AI-crawler robots.txt rule and the opt-out list required before any visit (candidate lists, round 1)
      - run: node test/finder-safety-tests.js
      # robots.txt for every host a page load reaches, redirects included, and every stopped request kept (candidate
      # lists, round 2, findings 25 and 30): the real browser against local servers
      - run: node test/robots-redirect-tests.js
      # the shared browser opener of live pages (src/util/safe-live-page.js) and the S21 known gaps it fixes: the opt-out
      # list, both lists, robots.txt and every redirect host first; each tool's real command line against local servers
      - run: node test/safe-live-page-tests.js
      # the published-score site reports: the live-site harness on a local site, the report numbers, and every report
      # in docs/comparison/published/2026-10-28/site-reports recomputed from its raw data (about 1 minute)
      - run: node test/site-reports-tests.js
      - run: node test/onboard-tests.js
      - run: node test/handover-tests.js
      - run: node test/lang-tests.js
      - run: node test/dawn-like-tests.js
      - run: node test/parity-tests.js
      - run: node test/aaa-more-tests.js
      - run: node test/beyond-law-tests.js
      # the overlay report: a local test site with a stand-in overlay script, real browser runs, and (D248) our fixes on
      # a copy with an injected fixer (about 10 minutes)
      - run: node test/overlay-report-tests.js
      # the overlay evidence faults found on 104 real overlay sites (31 October 2026): shadow-root buttons, hidden skip
      # links, accessiBe's settings file, Recite Me's own elements, only the supplier's script counts (local pages)
      - run: node test/overlay-evidence-tests.js
      - run: node addons/emails/test/views-tests.js
      - run: node addons/screenreader/test/remote-tests.js
      # TalkBack, the optional third screen reader (stand-in adb, log and Chrome; off by default until proved)
      - run: node addons/screenreader/test/talkback-tests.js
      # the round 1 safety fixes S2 to S15, and S1: the live checkout is viewed only (D208)
      - run: node test/safety-fixes-tests.js
      - run: node test/ai-budget-d277-tests.js
      # D365, D366 the AI route switch: paid audits on the API key; our own tests on the included API credits, then
      # Claude Code on the subscription (stand-ins only, nothing spent)
      - run: node test/ai-route-tests.js
      # round 3 of the AI route review: every entry point names its site (finding 3); the screen reader's borderline
      # cases judged on the audit machine, never on the GitHub machines (finding 4); media and picture answers saved as
      # they arrive and reused on a resume (finding 8)
      - run: node test/ai-site-named-tests.js
      - run: node addons/screenreader/test/judge-remote-tests.js
      - run: node test/ai-answers-tests.js
      # round 5 of the independent review of the AI route switch (docs/review/ai-route-review-round5.txt)
      - run: node test/ai-route-round5-tests.js
      # round 6 (docs/review/ai-route-review-round6.txt)
      - run: node test/ai-route-round6-tests.js
      # round 7 (docs/review/ai-route-review-round7.txt)
      - run: node test/ai-route-round7-tests.js
      # round 8 (docs/review/ai-route-review-round8.txt)
      - run: node test/ai-route-round8-tests.js
      # round 9 (docs/review/ai-route-review-round9.txt)
      - run: node test/ai-route-round9-tests.js
      # round 10: option B (docs/review/ai-route-review-round10.txt)
      - run: node test/ai-route-round10-tests.js
      # D325 the paid job's AI limit from a recorded payment; D326, D327 the cost review request; D316 the GitHub
      # minutes guard (no network, no AI)
      - run: node test/paid-limit-d325-tests.js
      - run: node test/cost-review-d327-tests.js
      - run: node test/github-minutes-tests.js
      # D353, D354, D355 the split full audit on a stand-in GitHub: the plan, the funds check, a split audit equal to a
      # single-machine one, a failed part resumed alone (no network, no browser, no AI)
      - run: node test/audit-split-tests.js
      - run: node test/live-checkout-tests.js
      - run: node addons/monitor/test/billing-tests.js
      - run: node addons/monitor/test/statements-tests.js
      # no browser and no network
      - run: node addons/fixes/test/recipes-interaction-tests.js
      # the quality gate and learning loop (D204): its rules, figures, AI review with a stand-in model, lessons log,
      # and every send path refusing an un-gated document (no browser, no network; reads PDFs with pdftotext)
      - run: node test/gate-tests.js
      - run: node test/gate-send-tests.js
      # the draft WebAIM invitation email: tool list, wording rules and owner decisions (round 4 review, D215, D239)
      - run: node test/webaim-email-tests.js
      # the draft heads of terms for the solicitor: style, numbering, section 8, replaced wording (D249 to D259)
      - run: node test/heads-of-terms-tests.js

  # the benchmark shop (D241, D242), in its own job since its browser sweeps grew (rounds 12 to 16: reflow, text
  # spacing, hover, contrast in every state, menus open, every control and form used, timers run on): about 20 to 25
  # minutes on a busy machine, too long for the quick job's limit. The shop matches its build, every A and AA criterion
  # and W3C failure has a planted fault or a reason, the answer key points at real elements, no form submits, nothing
  # gives the answers away, the scorer's numbers and that it cannot be gamed; then in Chromium: real contrast, the
  # behaviour-dependent faults and twins, and axe-core finding nothing outside the key (no network: a local test server)
  benchmark:
    needs: changed
    # not on a push: the full set runs on a pull request, by hand, or in the public copy after each push (D315, D358)
    if: needs.changed.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name != 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Jasong-ithub/accessibility-full-tool
          ref: ${{ needs.changed.outputs.sha }}
          token: ${{ secrets.TOOL_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # (learning pass 1 tests run the keyboard and target size checks in Firefox and Safari too)
      - run: npx playwright install --with-deps chromium firefox webkit
      # the pinned font set (src/util/fonts.js): text the same size on every machine that runs the browsers
      - run: node tools/font-set.mjs --install
      - run: node test/benchmark-shop-tests.js
      # learning pass 1 (D351, D359, D360): each miss and false alarm of our own audit on the shop, turned into a rule
      # change and proved on the shop's local pages with its clean twin (docs/benchmark/ours/LEARN-PASS-1.txt), Chromium,
      # with Firefox and Safari for the keyboard and target size checks
      - run: node test/learn-pass1-tests.js
      # learning pass 2, group B (forms, checkout and errors; D351, D359, D360, D426): each miss turned into a rule change
      # and proved on the shop's local pages with a clean page (docs/benchmark/ours/LEARN-PASS-2-GROUP-B.txt), Chromium desktop
      - run: node test/learn-pass2-group-b-tests.js
      # learning pass 2, group A (D351, D359, D360, D426): the keyboard, focus and interaction faults the clean re-audit
      # missed (docs/benchmark/ours/LEARN-PASS-2-GROUP-A.txt), each proved on the shop's local pages with a clean page,
      # Chromium desktop
      - run: node test/learn-pass2-group-a-tests.js
      # learning pass 2, group D (D351, D359, D360, D426): names, roles, ARIA, tables and frames the clean re-audit
      # missed (docs/benchmark/ours/LEARN-PASS-2-GROUP-D.txt), each proved on the shop's local pages with a clean page,
      # Chromium desktop
      - run: node test/learn-pass2-group-d-tests.js
      # learning pass 2, group C (visual, content, structure and consistency; D426 Chrome desktop only): each miss turned
      # into a rule change and proved on the shop's local pages with a clean page (docs/benchmark/ours/LEARN-PASS-2-GROUP-C.txt)
      - run: node test/learn-pass2-group-c-tests.js
      # the category of each finding in its context (D377), against the answer key's tiers (one step in Chromium, so it
      # runs here, where Chromium is installed, not on every push)
      - run: node test/category-tests.js
      # the target-size re-measuring of the unmatched findings (D428) on small fixture pages, in Chromium with the
      # pinned fonts: hidden, visible, partly hidden and script-click neighbours
      - run: node test/benchmark-unmatched-targets-tests.js
      # the catalogue against w3.org as it is now (D373): fails when W3C has added or changed a way to fail
      - run: node tools/catalogue/check.mjs --online

  # the real-site gate for learned rules (D391, review of learning pass 1): on every page of
  # test/fixtures/realsite-gate/ (common real-site patterns, each correct under W3C's documents) no rule may give a
  # definite failure, the core page tests and the content, interaction, timing, media, visual and keyboard add-ons run
  # in every browser run of the full audit
  realsitegate:
    needs: changed
    # not on a push: on a pull request or by hand (Actions tab, Run workflow), D315 and D350; the public copy of the
    # suite runs it free (D358)
    if: needs.changed.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name != 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # one job per browser run of the full audit, together every run (R227); each about 90 minutes since the keyboard
    # add-on joined the gate (the Chromium run took 88 minutes on 10 November 2026, learning pass 2, group A), so a run on
    # this private repository costs about USD 2.70 (5 jobs at about 90 minutes, USD 0.006 a minute), within the
    # 120 minute job limit
    strategy:
      fail-fast: false
      matrix:
        run: [chromium, firefox, webkit, webkit-phone, webkit-tablet]
    env:
      A11Y_GATE_RUNS: ${{ matrix.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Jasong-ithub/accessibility-full-tool
          ref: ${{ needs.changed.outputs.sha }}
          token: ${{ secrets.TOOL_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # the pinned font set (src/util/fonts.js): text the same size on every machine that runs the browsers
      - run: node tools/font-set.mjs --install
      - run: node test/realsite-gate-tests.js
      # the results file, saved page by page as the run goes (R228), kept with the run
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realsite-gate-${{ matrix.run }}
          path: scans/realsite-gate/
          if-no-files-found: warn

  # the converters of the benchmark tool runs (D334 to D336, D340): each tool's output fixture maps to the right
  # findings and scores, the coverage analysis, hand-test answers, WAVE skipped without its key. Here by hand only (D315;
  # the public copy also runs it on each scheduled run that tests a commit, D358):
  # the tool runs themselves (node tools/benchmark-tools/run.mjs) are never started here.
  benchmarktools:
    needs: changed
    # here only when started by hand (Actions tab, Run workflow), never on a push or a pull request; the public copy also
    # runs it on each scheduled run there that tests a commit (each new commit, and weekly; free, D358)
    if: needs.changed.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Jasong-ithub/accessibility-full-tool
          ref: ${{ needs.changed.outputs.sha }}
          token: ${{ secrets.TOOL_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node test/benchmark-tools-tests.js
      - run: node test/benchmark-scorer-fixes-tests.js

  monitor:
    needs: changed
    # not on a push: the full set runs on a pull request, by hand, or in the public copy after each push (D315, D358)
    if: needs.changed.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name != 'push')
    runs-on: ubuntu-24.04
    # monitor run-tests alone took 17.5 minutes on a busy machine
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Jasong-ithub/accessibility-full-tool
          ref: ${{ needs.changed.outputs.sha }}
          token: ${{ secrets.TOOL_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Firefox and WebKit too: the monitoring tests re-test pages in every browser
      - run: npx playwright install --with-deps chromium firefox webkit
      # the pinned font set (src/util/fonts.js): text the same size on every machine that runs the browsers
      - run: node tools/font-set.mjs --install
      - run: node addons/monitor/test/run-tests.js
      - run: node addons/monitor/test/full-monitoring-tests.js
      - run: node addons/monitor/test/daily-tests.js
      - run: node addons/designs/test/run-tests.js
      - run: node addons/crosspage/test/run-tests.js
      - run: node addons/process/test/run-tests.js
      - run: node addons/login/test/run-tests.js
      - run: node addons/reaudit/test/run-tests.js
      - run: node addons/documents/test/run-tests.js

  addons:
    needs: changed
    # not on a push: the full set runs on a pull request, by hand, or in the public copy after each push (D315, D358)
    if: needs.changed.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name != 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Jasong-ithub/accessibility-full-tool
          ref: ${{ needs.changed.outputs.sha }}
          token: ${{ secrets.TOOL_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # the demo fixes tests read the text of the demo report's PDF (pdftotext); the media batch 4 tests record an HLS
      # stream of MPEG-TS segments, which ffmpeg-static 7.0.2 cannot read (it crashes), so the system ffmpeg is used
      # (addons/media/lib/live.js pickFfmpeg; tools/check-tests-listed.mjs fails if it is taken away, 9 November 2026)
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # the pinned font set (src/util/fonts.js): text the same size on every machine that runs the browsers
      - run: node tools/font-set.mjs --install
      # the statements tests read and write Word files (the VPAT). The tools run Python isolated (python3 -I), which
      # does not see packages pip puts in the user's own folder on the runner, so the system package is installed
      # (9 November 2026: "No module named 'docx'" with pip install python-docx), and pip's version, as on our own machines
      - run: sudo python3 -m pip install --break-system-packages python-docx
      - run: node addons/interaction/test/run-tests.js
      - run: node addons/media/test/run-tests.js
      - run: node addons/media/test/batch4-tests.js
      - run: node addons/media/test/drafts-tests.js
      - run: node addons/judgement/test/run-tests.js
      - run: node addons/content/test/run-tests.js
      - run: node addons/timing/test/run-tests.js
      - run: node addons/timing/test/batch2-recipes-tests.js
      - run: node addons/timing/test/batch2-tests.js
      - run: node addons/visual/test/run-tests.js
      - run: node addons/visual/test/recipes-tests.js
      - run: node addons/keyboard/test/run-tests.js
      - run: node addons/keyboard/test/batch2-tests.js
      - run: node addons/screenreader/test/run-tests.js
      - run: node addons/screenreader/test/values-tests.js
      - run: node addons/statements/test/run-tests.js
      - run: node addons/beyond/test/run-tests.js
      - run: node addons/beyond/test/calls-tests.js
      - run: node addons/cognitive/test/run-tests.js
      - run: node addons/display/test/run-tests.js
      - run: node addons/copyjourney/test/run-tests.js
      - run: node addons/emails/test/run-tests.js
      - run: node addons/demo/test/run-tests.js
      # the issues view (D378): the proof audit of the benchmark shop in both modes, keyboard, focus, axe-core
      - run: node addons/issues/test/run-tests.js

  # the overlay on/off test (D246, D247): a local fixture shop with a stand-in overlay, the overlay on, off (blocked in
  # our browser only) and our fixes on copies (an injected fixer, no AI), about 6 minutes
  overlayonoff:
    needs: changed
    # not on a push: the full set runs on a pull request, by hand, or in the public copy after each push (D315, D358)
    if: needs.changed.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name != 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Jasong-ithub/accessibility-full-tool
          ref: ${{ needs.changed.outputs.sha }}
          token: ${{ secrets.TOOL_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # the pinned font set (src/util/fonts.js): text the same size on every machine that runs the browsers
      - run: node tools/font-set.mjs --install
      - run: node test/overlay-onoff-tests.js
      # a stopped run carried on with --resume: nothing compared or answered before is visited or asked again (R228)
      - run: node test/overlay-onoff-resume-tests.js
      # overlays tested like a person uses them (D427): each widget profile switched on in turn, every state tested
      - run: node test/overlay-person-tests.js
      # the on/off test's pages (D418): one page of every design and the public journey, on a local Shopify-like stand-in
      - run: node test/overlay-page-choice-tests.js

  gaps:
    needs: changed
    # not on a push: the full set runs on a pull request, by hand, or in the public copy after each push (D315, D358)
    if: needs.changed.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name != 'push')
    runs-on: ubuntu-24.04
    # not timed on their own in the reports; the timing gap tests watch each page for 30 seconds and more
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Jasong-ithub/accessibility-full-tool
          ref: ${{ needs.changed.outputs.sha }}
          token: ${{ secrets.TOOL_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # the pinned font set (src/util/fonts.js): text the same size on every machine that runs the browsers
      - run: node tools/font-set.mjs --install
      - run: node addons/content/test/gaps-tests.js
      - run: node addons/content/test/batch3-tests.js
      - run: node addons/interaction/test/gaps-tests.js
      - run: node addons/keyboard/test/gaps-tests.js
      - run: node addons/timing/test/gaps-tests.js

  fixes:
    needs: changed
    # not on a push: the full set runs on a pull request, by hand, or in the public copy after each push (D315, D358)
    if: needs.changed.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name != 'push')
    runs-on: ubuntu-24.04
    # 35 minutes on a busy machine, with the four files it runs as their own processes
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Jasong-ithub/accessibility-full-tool
          ref: ${{ needs.changed.outputs.sha }}
          token: ${{ secrets.TOOL_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # the pinned font set (src/util/fonts.js): text the same size on every machine that runs the browsers
      - run: node tools/font-set.mjs --install
      # the add-on fixes build and mend Word, PowerPoint and Excel files with pictures, and rebuild PDFs
      # system-wide, for the same reason as the statements job: the tools run Python isolated (python3 -I), which does
      # not see packages pip puts in the user's own folder (9 November 2026: 8 document fixes failed on GitHub)
      - run: sudo python3 -m pip install --break-system-packages python-docx python-pptx openpyxl pillow pdfminer.six lxml
      # PDF figure descriptions are drafted from the page as a picture (pdftoppm, poppler; 9 November 2026: 2 failed without it)
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: node addons/fixes/test/run-tests.js
      # time limits on every AI call and browser step, and the stuck-run report (31 October 2026)
      - run: node addons/fixes/test/time-limit-tests.js
      # the spending limit never passed (each call's worst case) and the quality gate's share of it (31 October 2026)
      - run: node addons/fixes/test/cap-worst-case-tests.js
      # the focused proof of each fix and the full final check (31 October 2026)
      - run: node addons/fixes/test/focused-proof-tests.js
      # the final check on every page and section, the making sequence and the edit and answer journal (review round 2
      # of the overlay work, findings 1, 3, 4 and 5)
      - run: node addons/fixes/test/final-check-journal-tests.js
      # proofs side by side, a page that will not load, no second try when declined, prompt caching, excerpts (7 November 2026)
      - run: node addons/fixes/test/speed-tests.js
      # run by addons/fixes/test/run-tests.js: addons/fixes/test/route2-tests.js, addons/fixes/test/apply-tests.js, addons/fixes/test/addon-fixes-tests.js, addons/fixes/test/rules-tests.js, addons/fixes/test/remote-tests.js

  prelive:
    needs: changed
    # not on a push: the full set runs on a pull request, by hand, or in the public copy after each push (D315, D358)
    if: needs.changed.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name != 'push')
    runs-on: ubuntu-24.04
    # 13 minutes on a quiet machine, 22.5 on a busy one
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Jasong-ithub/accessibility-full-tool
          ref: ${{ needs.changed.outputs.sha }}
          token: ${{ secrets.TOOL_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # the pinned font set (src/util/fonts.js): text the same size on every machine that runs the browsers
      - run: node tools/font-set.mjs --install
      - run: node test/prelive-tests.js

  everypage:
    needs: changed
    # not on a push: the full set runs on a pull request, by hand, or in the public copy after each push (D315, D358)
    if: needs.changed.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name != 'push')
    runs-on: ubuntu-24.04
    # the two stages took about 5 minutes on a quiet machine; every page uses stand-ins apart from one real keyboard run
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Jasong-ithub/accessibility-full-tool
          ref: ${{ needs.changed.outputs.sha }}
          token: ${{ secrets.TOOL_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Firefox and WebKit: the every page tests run the real keyboard add-on in both
      - run: npx playwright install --with-deps chromium firefox webkit
      # the pinned font set (src/util/fonts.js): text the same size on every machine that runs the browsers
      - run: node tools/font-set.mjs --install
      - run: node test/everypage-tests.js
      # Firefox and the network's own certificate authority, the page-load record of a unit, each browser's real https
      # check and the pinned font set (the split audit proof of 9 November 2026), with real browsers on local sites
      - run: node test/browser-launch-tests.js
      # the font set's other route, kept proved: every pinned package downloaded from Ubuntu's archive snapshot of the
      # recording day only, and each font file checked (used when a version has left the archive; review rounds 2 and 3)
      - run: node tools/font-set.mjs --prove-snapshot
      - run: node test/twostage-tests.js
      # the free audit of D296 and D297 (node src/cli.js free-audit): the page list cut at the GBP 5 unpaid limit (home
      # and journeys always kept), the gate rule R225, the report's order, the two-stage final check after the fixes and
      # the cost never passed, with a stand-in shop and stand-in AI answering at its worst case, about 1 minute
      - run: node test/free-audit-tests.js
      # the first free audit run end to end (G1, 10 November 2026): its report rendered again from the kept results
      # and checked for every fault that run showed (R21, R126, R225, the press limit, the barrier reason), seconds
      - run: node test/g1-free-audit-tests.js
      # the fixes from the tool comparison (G1 to G4, F1 to F4), in Chromium and Firefox, about 5 minutes
      - run: node test/comparison-fixes-tests.js
      # the fixes from the manual checks of council pages (cookie panel holding focus, header button found again,
      # transparent carousel text, a trap inside a shadow root), local fixtures only, Chromium and Firefox, about 3 minutes
      - run: node test/council-fixes-tests.js
      # the false results found by hand on the owner's own site (a modal cookie consent dialog holding focus, answered
      # with Deny by keyboard, never Accept; the contact form behind it), local fixtures only, through the keyboard
      # check, the form test, the journeys, the lead scan and first look, and the full audit's runs, about 4 minutes
      - run: node test/consent-modal-tests.js
      # never Accept on a cookie banner (owner's standing rule): stand-in banners (reject only, accept only, accept with
      # save or close, OK only, Accept as a DIV, the settings route with categories off or on by default, a settings panel with only
      # Accept all) through the page preparation, the keyboard chooser, the evidence pictures, the journeys and the
      # screen reader targets, and safety rule S18 against the old accept fallbacks; local fixtures, about 2 minutes
      - run: node test/no-accept-tests.js

  signedin:
    needs: changed
    # not on a push: the full set runs on a pull request, by hand, or in the public copy after each push (D315, D358)
    if: needs.changed.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name != 'push')
    runs-on: ubuntu-24.04
    # 45 minutes on a busy machine (most of it the full audit behind the sign-in in three browsers)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Jasong-ithub/accessibility-full-tool
          ref: ${{ needs.changed.outputs.sha }}
          token: ${{ secrets.TOOL_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # the pinned font set (src/util/fonts.js): text the same size on every machine that runs the browsers
      - run: node tools/font-set.mjs --install
      - run: node test/signed-in/run-tests.js

  full:
    needs: changed
    # here by hand or on a pull request only: it repeats the other jobs' tests (D315); the public copy also runs it on
    # each scheduled run there that tests a commit (each new commit, and weekly; free, D358)
    if: needs.changed.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    # npm test took 45 to 49 minutes on a busy 4-core machine (most of it the broken shop's journey videos and the
    # full audit)
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Jasong-ithub/accessibility-full-tool
          ref: ${{ needs.changed.outputs.sha }}
          token: ${{ secrets.TOOL_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # the pinned font set (src/util/fonts.js): text the same size on every machine that runs the browsers
      - run: node tools/font-set.mjs --install
      - run: npm test

  # the commit is marked tested once its run ends (passed or failed, not cancelled) with the copy check passed, so the
  # hourly check skips it; a copy left behind keeps every hourly run red until it is made again
  tested:
    needs: [changed, copy, listed, conflicts, docs, quick, benchmark, realsitegate, benchmarktools, monitor, addons, overlayonoff, gaps, fixes, prelive, everypage, signedin, full]
    if: ${{ !cancelled() && needs.changed.outputs.run == 'true' && needs.copy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: mkdir -p .tested && echo "${{ needs.changed.outputs.sha }}" > .tested/sha
      - uses: actions/cache/save@v4
        with:
          path: .tested
          key: tested-${{ needs.changed.outputs.sha }}
